server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bidsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:bidsphere}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-this-to-a-long-random-secret-123456}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
